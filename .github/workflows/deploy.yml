name: Deploy Staging to S3

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Get Stack Outputs
        id: stack
        env:
          STACK_NAME: schatzies-events
        run: |
          STAGING_BUCKET=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='StagingBucketName'].OutputValue" --output text)
          STAGING_CF_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='StagingDistributionId'].OutputValue" --output text)

          echo "staging_bucket=${STAGING_BUCKET}" >> $GITHUB_OUTPUT
          echo "staging_cf_id=${STAGING_CF_ID}" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: aws s3 sync dist s3://${{ steps.stack.outputs.staging_bucket }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.staging_cf_id }} \
            --paths "/*"