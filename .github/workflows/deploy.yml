name: Deploy Frontend to S3

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Get Stack Outputs and Set Target
        id: target
        env:
          STACK_NAME: schatzies-events
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            BUCKET_KEY="DeploymentBucketName"
            CF_KEY="CloudFrontDistributionId"
          else
            BUCKET_KEY="StagingBucketName"
            CF_KEY="StagingDistributionId"
          fi

          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='${BUCKET_KEY}'].OutputValue" --output text)
          CF_DIST_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='${CF_KEY}'].OutputValue" --output text)

          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "cf_dist_id=${CF_DIST_ID}" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: aws s3 sync dist s3://${{ steps.target.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.target.outputs.cf_dist_id }} \
            --paths "/*"