name: Deploy Frontend to S3
on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "s3_prefix=s3://schatzies-events-deployments" >> $GITHUB_OUTPUT
            echo "cf_path=/*" >> $GITHUB_OUTPUT
            echo "base_path=/" >> $GITHUB_OUTPUT
          else
            echo "s3_prefix=s3://schatzies-events-deployments/dev" >> $GITHUB_OUTPUT
            echo "cf_path=/dev/*" >> $GITHUB_OUTPUT
            echo "base_path=/dev/" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base_path }}
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to S3
        run: aws s3 sync dist ${{ steps.target.outputs.s3_prefix }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1RPTIUR2D81FJ \
            --paths "${{ steps.target.outputs.cf_path }}"