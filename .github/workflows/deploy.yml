name: Deploy Frontend to S3

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Get Stack Outputs
        id: stack
        env:
          STACK_NAME: schatzies-events
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='DeploymentBucketName'].OutputValue" --output text)
          CF_DIST_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)

          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "cf_dist_id=${CF_DIST_ID}" >> $GITHUB_OUTPUT

      # ── PROD (master) ──────────────────────────────────────────
      - name: Build frontend (prod)
        if: github.ref_name == 'master'
        run: pnpm build

      - name: Deploy to S3 (prod)
        if: github.ref_name == 'master'
        run: aws s3 sync dist s3://${{ steps.stack.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront (prod)
        if: github.ref_name == 'master'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_dist_id }} \
            --paths "/*"

      # ── STAGING (dev) ──────────────────────────────────────────
      - name: Build frontend (staging)
        if: github.ref_name == 'dev'
        env:
          VITE_BASE_PATH: /staging/
          VITE_API_URL: /api
        run: pnpm build

      - name: Deploy to S3 (staging)
        if: github.ref_name == 'dev'
        run: aws s3 sync dist s3://${{ steps.stack.outputs.bucket_name }}/staging --delete

      - name: Invalidate CloudFront (staging)
        if: github.ref_name == 'dev'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_dist_id }} \
            --paths "/staging/*"